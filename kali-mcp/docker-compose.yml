version: '3.8'

services:
  kali-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: kali-mcp:latest
    container_name: kali-mcp
    ports:
      - "8080:8080"
    volumes:
      - ./workspace:/workspace
    environment:
      - MCP_PORT=8080
    restart: unless-stopped
    # Host networking lets nmap/tcpdump reach real network interfaces
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
