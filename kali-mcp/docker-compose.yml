version: '3.8'

services:
  kali-claude:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kali-claude-mcp
    volumes:
      # Mount your workspace into the container
      - ./workspace:/workspace
      # Persist Claude auth/config across rebuilds
      - claude-config:/home/claude/.claude
    environment:
      # Set your Anthropic API key here or via .env file
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    stdin_open: true
    tty: true
    restart: unless-stopped
    network_mode: host

volumes:
  claude-config:
