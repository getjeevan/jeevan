version: '3.8'

services:
  kali-claude:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kali-claude-mcp
    volumes:
      # Workspace is shared with host AND persists .mcp.json across restarts
      - ./workspace:/workspace
      # Persist Claude auth (~/.claude.json) across container restarts
      - claude-home:/home/claude
    environment:
      # Auth: Claude Code reads this automatically — no login needed
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    stdin_open: true
    tty: true
    restart: unless-stopped
    network_mode: host

volumes:
  # Named volume keeps ~/.claude.json and ~/.claude/ alive across rebuilds
  claude-home:
