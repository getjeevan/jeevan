version: '3.8'

services:

  # ── Kali Linux tool MCP (port 8080) ─────────────────────────────────────────
  kali-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: kali-mcp:latest
    container_name: kali-mcp
    environment:
      - MCP_PORT=8080
    volumes:
      - ./workspace:/workspace
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Jupyter MCP (port 8081) ──────────────────────────────────────────────────
  jupyter-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: kali-mcp:latest
    container_name: jupyter-mcp
    command: ["node", "/app/jupyter-mcp-server.mjs"]
    environment:
      - JUPYTER_MCP_PORT=8081
      - JUPYTER_URL=https://65.95.15.70:32225
      # Set JUPYTER_TOKEN in .env if your Jupyter server requires auth
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-}
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
