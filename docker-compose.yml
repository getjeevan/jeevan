version: '3.8'

# ──────────────────────────────────────────────────────────────────────────────
#  Self-hosted Replit replacement — 192.168.1.168
#  All services use host networking so they can reach each other at localhost.
#
#  Port map:
#    3225  VPNWatch      — Palo Alto VPN monitor
#    3333  Excalidraw    — architecture diagrams
#    4000  Infra Dash    — APM / container health
#    7080  Coder         — workspace IDE  ← main entry point
#    8080  Kali MCP      — Kali tools over SSE
#    8081  Jupyter MCP   — vast.ai Jupyter bridge
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Coder — browser IDE + workspace orchestrator (:7080) ──────────────────
  coder:
    image: ghcr.io/coder/coder:latest
    container_name: coder
    restart: unless-stopped
    network_mode: host
    environment:
      - CODER_HTTP_ADDRESS=0.0.0.0:7080
      - CODER_ACCESS_URL=https://coder.asheindallas.com
      - CODER_WILDCARD_ACCESS_URL=*.coder.asheindallas.com
      - CODER_PG_CONNECTION_URL=postgresql://coder:coderpass@localhost:5432/coder
      - CODER_TELEMETRY_ENABLE=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder-data:/home/coder/.config
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── VPNWatch — Palo Alto VPN monitor (:3225) ──────────────────────────────
  vpnwatch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpnwatch
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3225
      - DATA_DIR=/app/data
    volumes:
      - vpnwatch-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3225/api/stats', r => process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Infra Dashboard — APM / service health (:4000) ────────────────────────
  infra-dashboard:
    build:
      context: infra-dashboard
      dockerfile: Dockerfile
    container_name: infra-dashboard
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=4000
      - JUPYTER_URL=https://65.95.15.70:32225
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Kali MCP — security tools over SSE (:8080) ────────────────────────────
  kali-mcp:
    build:
      context: kali-mcp
      dockerfile: Dockerfile
    container_name: kali-mcp
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - MCP_PORT=8080
    volumes:
      - ./kali-mcp/workspace:/workspace
    command: ["node", "/app/mcp-server.mjs"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Jupyter MCP — vast.ai Jupyter bridge (:8081) ──────────────────────────
  jupyter-mcp:
    build:
      context: kali-mcp
      dockerfile: Dockerfile
    container_name: jupyter-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      - JUPYTER_MCP_PORT=8081
      - JUPYTER_URL=https://65.95.15.70:32225
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-}
    command: ["node", "/app/jupyter-mcp-server.mjs"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Excalidraw — architecture diagrams (:3333) ────────────────────────────
  excalidraw:
    image: nginx:alpine
    container_name: excalidraw
    restart: unless-stopped
    ports:
      - "3333:80"
    volumes:
      - ./excalidraw/index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  coder-data:
  vpnwatch-data:
  kali-home:
